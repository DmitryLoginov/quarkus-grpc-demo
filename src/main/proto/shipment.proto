syntax = "proto3";

package shipment.v1;

import "google/protobuf/timestamp.proto";

// separate generated .java files for each element
option java_multiple_files = true;
// package name for generated .java files
option java_package = "dev.ldv.shipment.grpc";
// wrapper .java filename
option java_outer_classname = "ShipmentProto";

enum ShipmentStatus {
  SHIPMENT_STATUS_UNSPECIFIED = 0;
  CREATED = 1;
  IN_TRANSIT = 2;
  OUT_FOR_DELIVERY = 3;
  DELIVERED = 4;
  CANCELLED = 5;
}

message CreateShipmentRequest {
  string tracking_number = 1;
  string origin = 2;
  string destination = 3;
}

message GetShipmentRequest {
  string shipment_id = 1;
}

message Shipment {
  string id = 1;
  string tracking_number = 2;
  string origin = 3;
  string destination = 4;
  ShipmentStatus status = 5;
  repeated Checkpoint checkpoints = 6;
}

service ShipmentService {
  rpc CreateShipment(CreateShipmentRequest)
      returns (Shipment);
  rpc GetShipment(GetShipmentRequest)
      returns (Shipment);
  rpc AddCheckpoint(AddCheckpointRequest)
      returns (ShipmentEvent);
}

message Checkpoint {
  string shipment_id = 1;
  ShipmentStatus status = 2;
  string location = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message AddCheckpointRequest {
  Checkpoint checkpoint = 1;
}

message ShipmentEvent {
  Shipment shipment = 1;
  Checkpoint checkpoint = 2;
}